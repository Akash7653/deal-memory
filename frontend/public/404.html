<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DealMemory</title>
    <script>
      // Single Page Application redirect handler for static hosts
      try {
        sessionStorage.redirect = location.href;
      } catch (e) {}
      window.location.replace('/');
    </script>
    <meta http-equiv="refresh" content="0;URL='/'">
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(147, 51, 234, 0.2);
        border-top-color: #9333ea;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="spinner"></div>
      <p style="font-size: 14px; color: #94a3b8; margin: 0;">Restoring session...</p>
    </div>
  </body>
</html>
